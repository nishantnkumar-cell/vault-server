# cargo-deny: run by CI on every change and weekly.
#   cargo install cargo-deny --locked && cargo deny check

[graph]
all-features = true

[advisories]
# A vulnerability, yanked or unsound library fails the build; "unmaintained"
# only for libraries this project asks for itself.
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
    "PolyForm-Noncommercial-1.0.0",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [{ name = "openssl" }, { name = "openssl-sys" }, { name = "native-tls" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The ml-dsa security fix, taken from the vault's own repository at a fixed
# commit (see [patch.crates-io] in Cargo.toml).
allow-git = ["https://github.com/nishantnkumar-cell/PasswordVault"]
