name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: systemd unit is valid
        run: |
          cargo build --release --locked
          sudo install -m 755 target/release/vault-server /usr/local/bin/
          systemd-analyze verify contrib/systemd/vault-server.service

  macos:
    name: macOS build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  docker:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vault-server:ci .
      - name: serves TLS with its own authority and keeps it across a restart
        run: |
          set -eu
          docker volume create vsdata
          run() { docker run -d --name vs -p 8443:8443 -e VAULT_SERVER_HOSTS=localhost -v vsdata:/data --read-only --cap-drop ALL vault-server:ci; }
          run
          for i in $(seq 30); do docker exec vs vault-server show >/dev/null 2>&1 && break; sleep 1; done
          docker exec vs vault-server show | tee show.txt
          fp=$(awk '/fingerprint:/{print $2}' show.txt)
          docker cp vs:/data/tls/ca.pem ca.pem
          for i in $(seq 30); do curl -sf --cacert ca.pem https://localhost:8443/ && break; sleep 1; done
          got=$(openssl x509 -in ca.pem -outform der | openssl dgst -sha256 -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          test "$fp" = "$got"
          docker rm -f vs
          run
          for i in $(seq 30); do curl -sf --cacert ca.pem https://localhost:8443/ && break; sleep 1; done
          test "$(docker exec vs vault-server show | awk '/fingerprint:/{print $2}')" = "$fp"
          docker logs vs

  vault-client:
    name: Works with the vault's own sync client
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nishantnkumar-cell/PasswordVault
          path: vault
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            vault
      - run: sudo apt-get update && sudo apt-get install -y libtss2-dev libudev-dev libhidapi-dev libdbus-1-dev pkg-config
      - name: Build the server and the client check
        run: |
          cargo build --locked
          mkdir -p vault/crates/vault-cloud/examples
          cp compat/compat-check.rs vault/crates/vault-cloud/examples/
          (cd vault && cargo build -p vault-cloud --example compat-check)
      - name: Run the vault client against vault-server
        run: |
          set -eu
          d=$(mktemp -d)
          ./target/debug/vault-server --data "$d" --hosts localhost init > /dev/null
          ./target/debug/vault-server --data "$d" --listen 127.0.0.1:8443 serve &
          for i in $(seq 30); do curl -sfk https://localhost:8443/ >/dev/null && break; sleep 1; done
          fp=$(./target/debug/vault-server --data "$d" show | awk '/fingerprint:/{print $2}')
          vault/target/debug/examples/compat-check https://localhost:8443 "$fp" "$(cat "$d/admin-key")"

  # The .deb is installed with real dpkg and started by systemd, then removed.
  deb:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: contrib/deb/build.sh
      - name: Install, start, check, remove
        run: |
          set -eux
          ver=$(contrib/package/version.sh)
          deb=target/packages/vault-server_${ver}_amd64.deb
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb" | grep -q ./usr/bin/vault-server
          sudo apt-get install -y "./$deb"
          test "$(vault-server --version)" = "vault-server $ver"
          getent passwd vault-server
          test "$(stat -c '%a %U' /etc/vault-server/env)" = "600 root"
          systemd-analyze verify /usr/lib/systemd/system/vault-server.service
          # Not started by the install: it needs its host names first.
          ! systemctl is-active --quiet vault-server
          echo 'VAULT_SERVER_HOSTS=localhost' | sudo tee -a /etc/vault-server/env
          sudo systemctl enable --now vault-server
          for i in $(seq 30); do sudo test -f /var/lib/vault-server/tls/ca.pem && break; sleep 1; done
          for i in $(seq 30); do curl -sf --cacert <(sudo cat /var/lib/vault-server/tls/ca.pem) https://localhost:8443/ && break; sleep 1; done
          sudo systemctl is-active vault-server
          # Upgrading in place keeps the data and restarts the server.
          sudo apt-get install -y --reinstall "./$deb"
          sudo systemctl is-active vault-server
          sudo test -f /var/lib/vault-server/tls/ca.pem
          sudo apt-get remove -y vault-server
          test ! -e /usr/bin/vault-server
          ! systemctl is-active --quiet vault-server
          # Removing the program keeps the data.
          sudo test -f /var/lib/vault-server/tls/ca.pem
      - run: contrib/package/tarball.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/packages/*.deb
            target/packages/*.tar.gz

  # The Arch package, built and installed in an Arch container.
  arch:
    name: Arch package
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust systemd
      - uses: actions/checkout@v4
      # makepkg refuses to run as root.
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && CARGO_HOME=/home/builder/.cargo contrib/arch/build.sh"
      - name: Check the package
        run: |
          ver=$(contrib/package/version.sh)
          pkg=target/packages/vault-server-$ver-x86_64.pkg.tar.zst
          pacman -Qip "$pkg"
          pacman -Qlp "$pkg" | grep -q /usr/bin/vault-server
          pacman -U --noconfirm "$pkg"
          test "$(vault-server --version)" = "vault-server $ver"
          test "$(stat -c '%a %U' /etc/vault-server/env)" = "600 root"
          pacman -R --noconfirm vault-server
          test ! -e /usr/bin/vault-server
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: target/packages/*.pkg.tar.zst

  # A tag such as v0.3.0 drafts a GitHub release with the packages attached;
  # it stays a draft until someone publishes it.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, docker, vault-client, deb, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          want=$(contrib/package/version.sh)
          test "${TAG#v}" = "$want" || { echo "::error::tag $TAG does not match version $want in Cargo.toml"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir dist
          cp artifacts/*/* dist/
          (cd dist && sha256sum -- * > SHA256SUMS.txt)
          ls -l dist
          gh release create "$TAG" dist/* --draft --title "vault-server ${TAG#v}" \
            --notes "See docs/release-notes.md. Packages: .deb (Debian 13, Ubuntu 24.04 and newer), Arch, and a .tar.gz for any Linux with systemd. Check downloads against SHA256SUMS.txt."

