[package]
name = "vault-server"
version = "0.3.0"
edition = "2024"
description = "Sync and backup server for Secret Vault: speaks the vault sync API 1, post-quantum TLS, own certificate authority."
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/nishantnkumar-cell/vault-server"
publish = false

[dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
anyhow = "1.0.105"
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
data-encoding = "2.11.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
hyper-util = { version = "0.1.21", features = ["tokio", "server-auto", "service", "http1", "http2"] }
rcgen = { version = "0.14.10", features = ["aws_lc_rs", "pem", "x509-parser"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "prefer-post-quantum"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
time = "0.3.55"
vault-core = { git = "https://github.com/nishantnkumar-cell/PasswordVault", rev = "bfa0cb7263a0d5785ac27f84f40ca444a61944ef" }
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "aws_lc_rs", "std", "tls12"] }
tempfile = "3.27.0"
tokio-rustls = "0.26.6"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

# vault-core pins ml-dsa 0.0.4, which has RUSTSEC-2025-0144 (a timing
# side-channel). The vault repo patches it with a vendored copy that has the
# upstream fix backported; cargo does not carry that patch through a git
# dependency, so repeat it here. Remove when vault-core moves to ml-dsa >= 0.1.
[patch.crates-io]
ml-dsa = { git = "https://github.com/nishantnkumar-cell/PasswordVault", rev = "bfa0cb7263a0d5785ac27f84f40ca444a61944ef" }
